name: Build Friday AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Verify project structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== open-jarvis-main folder ==="
          ls -la open-jarvis-main/ || echo "NOT FOUND"
          echo "=== app folder ==="
          ls -la open-jarvis-main/app/ || echo "NOT FOUND"

      - name: Build Debug APK
        working-directory: open-jarvis-main
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-ai-debug-apk
          path: open-jarvis-main/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
